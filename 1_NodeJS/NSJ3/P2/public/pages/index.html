<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2 — Navegación DHTML | Sara Willers Lohr</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link id="theme-link" rel="stylesheet" href="../styles/light.css">
  <link rel="stylesheet" href="../styles/responsive.css">
  <script src="../scripts/theme.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg sticky-top custom-navbar py-2">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <i class="bi bi-signpost-split-fill text-primary me-2 fs-3"></i>
        <span><span class="fw-bold text-main d-block lh-1">P2 · Navegación</span><small class="text-muted">5 eventos DHTML</small></span>
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navP2"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="navP2">
        <span class="navbar-text ms-lg-3 text-muted"><i class="bi bi-mortarboard me-1"></i> Sara Willers Lohr</span>
        <div class="ms-auto">
          <button id="btn-theme-toggle" class="btn btn-outline-secondary rounded-circle btn-theme-toggle" type="button"><i id="theme-icon" class="bi bi-sun-fill fs-5"></i></button>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-3 pb-5">
    <section class="glass-panel p-4 mb-4">
      <span class="workspace-badge"><i class="bi bi-2-circle-fill me-1"></i> Consigna 2</span>
      <h1 class="h3 fw-bold text-main mb-2">Navegación entre componentes</h1>
      <p class="text-muted mb-3">Index con botones de acceso a 5 secciones. Cada una usa un evento distinto.</p>

      <ul class="nav nav-pills subnav-pills mb-3 flex-wrap" id="subnav-pages">
        <li class="nav-item"><button type="button" class="nav-link active" data-page="inicio">Inicio</button></li>
        <li class="nav-item"><button type="button" class="nav-link" data-page="perfil">Perfil</button></li>
        <li class="nav-item"><button type="button" class="nav-link" data-page="config">Config</button></li>
        <li class="nav-item"><button type="button" class="nav-link" data-page="stats">Stats</button></li>
        <li class="nav-item"><button type="button" class="nav-link" data-page="ayuda">Ayuda</button></li>
      </ul>
      <div id="nav-content" class="playground-area nav-content-area"></div>
    </section>

    <section class="terminal-console">
      <div class="terminal-header">
        <div class="d-flex align-items-center">
          <span class="terminal-dot dot-red"></span><span class="terminal-dot dot-yellow"></span><span class="terminal-dot dot-green"></span>
          <span class="text-white fs-7 ms-2 fw-semibold"><i class="bi bi-terminal me-1"></i> Consola Visual</span>
        </div>
        <button id="btn-clear-console" class="btn btn-sm btn-dark border-0 fs-7" type="button"><i class="bi bi-trash3 me-1"></i> Limpiar</button>
      </div>
      <div id="console-body" class="terminal-body"><div class="console-placeholder text-muted fst-italic fs-7">Esperando eventos...</div></div>
    </section>
  </main>

  <button id="back-to-top" class="back-to-top" type="button"><i class="bi bi-arrow-up-short"></i></button>

  <template id="tpl-inicio">
    <section><h2 class="h5 fw-bold text-main">Inicio</h2><p class="text-muted">Doble click en el recuadro.</p>
    <div id="box-dbclick" class="demo-box demo-box--dblclick" tabindex="0">Doble click acá</div></section>
  </template>
  <template id="tpl-perfil">
    <section><h2 class="h5 fw-bold text-main">Perfil</h2><p class="text-muted">Cambiá el selector.</p>
    <select id="perfil-select" class="form-select"><option value="usuario">Usuario</option><option value="admin">Admin</option><option value="invitado">Invitado</option></select></section>
  </template>
  <template id="tpl-config">
    <section><h2 class="h5 fw-bold text-main">Config</h2><p class="text-muted">Presioná teclas en el input.</p>
    <input type="text" id="config-input" class="form-control" autocomplete="off"></section>
  </template>
  <template id="tpl-stats">
    <section><h2 class="h5 fw-bold text-main">Stats</h2><p class="text-muted">Click derecho en el área.</p>
    <div id="stats-area" class="demo-box demo-box--context">Click derecho acá</div></section>
  </template>
  <template id="tpl-ayuda">
    <section><h2 class="h5 fw-bold text-main">Ayuda</h2><p class="text-muted">Arrastrá el cuadrado.</p>
    <div id="drag-element" class="demo-drag" draggable="true"></div></section>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../scripts/app.js"></script>
</body>
</html>
