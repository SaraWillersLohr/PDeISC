<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P4 — Nodos &lt;a&gt; | Sara Willers Lohr</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link id="theme-link" rel="stylesheet" href="../styles/light.css">
  <link rel="stylesheet" href="../styles/responsive.css">
  <script src="../scripts/theme.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg sticky-top custom-navbar py-2">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <i class="bi bi-link-45deg text-primary me-2 fs-3"></i>
        <span><span class="fw-bold text-main d-block lh-1">P4 · Nodos &lt;a&gt;</span><small class="text-muted">Crear y modificar atributos</small></span>
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navP4"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="navP4">
        <span class="navbar-text ms-lg-3 text-muted"><i class="bi bi-mortarboard me-1"></i> Sara Willers Lohr</span>
        <div class="ms-auto"><button id="btn-theme-toggle" class="btn btn-outline-secondary rounded-circle btn-theme-toggle" type="button"><i id="theme-icon" class="bi bi-sun-fill fs-5"></i></button></div>
      </div>
    </div>
  </nav>

  <main class="container py-3 pb-5">
    <section class="glass-panel p-4 mb-4">
      <span class="workspace-badge"><i class="bi bi-4-circle-fill me-1"></i> Consigna 4</span>
      <h1 class="h3 fw-bold text-main mb-2">Crear y modificar enlaces</h1>
      <p class="text-muted mb-4">Al menos 5 nodos &lt;a&gt;. Al modificar, muestro atributo, valor anterior y cambio.</p>

      <div class="row g-3">
        <div class="col-md-6">
          <div class="inner-card">
            <h2 class="h6 fw-bold text-main mb-2">Crear enlaces</h2>
            <div class="d-flex flex-wrap gap-2">
              <button type="button" class="btn btn-outline-primary btn-sm" data-create="google">Google</button>
              <button type="button" class="btn btn-outline-primary btn-sm" data-create="github">GitHub</button>
              <button type="button" class="btn btn-outline-primary btn-sm" data-create="mdn">MDN</button>
              <button type="button" class="btn btn-outline-primary btn-sm" data-create="wiki">Wikipedia</button>
              <button type="button" class="btn btn-outline-primary btn-sm" data-create="so">StackOverflow</button>
            </div>
          </div>
          <div class="inner-card mt-3">
            <h2 class="h6 fw-bold text-main mb-2">Modificar</h2>
            <button type="button" class="btn btn-custom btn-sm" id="btn-modify-href" disabled>Cambiar href → YouTube</button>
          </div>
        </div>
        <div class="col-md-6">
          <div class="inner-card h-100">
            <h2 class="h6 fw-bold text-main mb-2">Enlaces en el DOM</h2>
            <div id="link-container" class="link-container"></div>
          </div>
        </div>
      </div>

      <div class="inner-card mt-3">
        <h2 class="h6 fw-bold text-main mb-2">Monitor de cambios</h2>
        <div id="attr-log" class="attr-log"><div class="attr-log-empty text-muted fs-7">Esperando nodos...</div></div>
      </div>
    </section>

    <section class="terminal-console">
      <div class="terminal-header">
        <div class="d-flex align-items-center">
          <span class="terminal-dot dot-red"></span><span class="terminal-dot dot-yellow"></span><span class="terminal-dot dot-green"></span>
          <span class="text-white fs-7 ms-2 fw-semibold"><i class="bi bi-terminal me-1"></i> Consola Visual</span>
        </div>
        <button id="btn-clear-console" class="btn btn-sm btn-dark border-0 fs-7" type="button"><i class="bi bi-trash3 me-1"></i> Limpiar</button>
      </div>
      <div id="console-body" class="terminal-body"><div class="console-placeholder text-muted fst-italic fs-7">Esperando eventos...</div></div>
    </section>
  </main>

  <button id="back-to-top" class="back-to-top" type="button"><i class="bi bi-arrow-up-short"></i></button>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../scripts/app.js"></script>
</body>
</html>
