<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyCheck-In | Airline System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/styles/style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark shadow-sm mb-5">
        <div class="container">
            <span class="navbar-brand fw-bold">✈ SKY-CHECKIN</span>
            <span class="text-white-50 small">Professional Airline System</span>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card border-0">
                    <h2 class="mb-4">REGISTRO DE PERSONAS</h2>
                    <form id="passengerForm" novalidate>
                        <div class="row g-4">
                            <div class="col-md-6">
                                <label class="form-label">Nombre</label>
                                <input type="text" id="nombre" class="form-control" placeholder="Nombre real" required>
                                <div class="invalid-feedback">Nombre inválido.</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Apellido</label>
                                <input type="text" id="apellido" class="form-control" placeholder="Apellido real" required>
                                <div class="invalid-feedback">Apellido inválido.</div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Edad</label>
                                <input type="number" id="edad" class="form-control" placeholder="Edad" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Fecha Nacimiento</label>
                                <input type="date" id="fechaNac" class="form-control" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Sexo</label>
                                <select id="sexo" class="form-select">
                                    <option value="male">Masculino</option>
                                    <option value="female">Femenino</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Documento (DNI)</label>
                                <input type="text" id="documento" class="form-control" placeholder="8 números" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Estado Civil</label>
                                <select id="estadoCivil" class="form-select">
                                    <option value="soltero">Soltero/a</option>
                                    <option value="casado">Casado/a</option>
                                    <option value="divorciado">Divorciado/a</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Nacionalidad</label>
                                <input type="text" id="nacionalidad" class="form-control" placeholder="Ej: Argentina" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Teléfono</label>
                                <input type="tel" id="telefono" class="form-control" placeholder="11 0000 0000" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email</label>
                                <input type="email" id="email" class="form-control" placeholder="correo@ejemplo.com" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">¿Tiene Hijos?</label>
                                <select id="tieneHijos" class="form-select">
                                    <option value="no">No</option>
                                    <option value="si">Sí</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Cant. Hijos</label>
                                <input type="number" id="cantidadHijos" class="form-control" value="0" disabled>
                            </div>
                        </div>

                        <div id="genderWarning" class="alert alert-warning hidden mt-4 border-0 shadow-sm">
                            ⚠️ El nombre no parece coincidir con el sexo seleccionado.
                        </div>

                        <div class="mt-4 p-3 bg-light rounded-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="termsCheck" required>
                                <label class="form-check-label small text-muted" for="termsCheck">
                                    Confirmo que los datos son correctos y acepto los <a href="#" class="text-primary fw-bold" data-bs-toggle="modal" data-bs-target="#termsModal">términos de embarque</a>.
                                </label>
                            </div>
                        </div>

                        <button type="submit" id="submitBtn" class="btn btn-primary w-100 mt-4" disabled>
                            CONFIRMAR CHECK-IN
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div id="passengerList" class="row g-3 mt-5"></div>
    </div>

    <div class="modal fade" id="termsModal" tabindex="-1">
        <div class="modal-dialog"><div class="modal-content p-4"><h6>Términos SKY</h6><p class="small">Datos protegidos para fines académicos.</p></div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/scripts/main.js"></script>
</body>
</html>
