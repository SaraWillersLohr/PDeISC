<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P3 — Hijos del DOM | Sara Willers Lohr</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link id="theme-link" rel="stylesheet" href="../styles/light.css">
  <link rel="stylesheet" href="../styles/responsive.css">
  <script src="../scripts/theme.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg sticky-top custom-navbar py-2">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <i class="bi bi-diagram-3-fill text-primary me-2 fs-3"></i>
        <span><span class="fw-bold text-main d-block lh-1">P3 · Hijos DOM</span><small class="text-muted">children.length</small></span>
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navP3"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="navP3">
        <span class="navbar-text ms-lg-3 text-muted"><i class="bi bi-mortarboard me-1"></i> Sara Willers Lohr</span>
        <div class="ms-auto"><button id="btn-theme-toggle" class="btn btn-outline-secondary rounded-circle btn-theme-toggle" type="button"><i id="theme-icon" class="bi bi-sun-fill fs-5"></i></button></div>
      </div>
    </div>
  </nav>

  <main class="container py-3 pb-5">
    <section class="glass-panel p-4 mb-4">
      <span class="workspace-badge"><i class="bi bi-3-circle-fill me-1"></i> Consigna 3</span>
      <h1 class="h3 fw-bold text-main mb-2">Contar hijos de un nodo</h1>
      <p class="text-muted mb-4">Basado en la navegación del P2: al pulsar el botón muestro cuántos hijos directos tiene el contenedor.</p>

      <div id="children-demo" class="children-demo playground-area">
        <p class="mb-2 w-100">Contenedor padre:</p>
        <span class="child-tag">span</span>
        <span class="child-tag">span</span>
        <em class="child-tag">em</em>
        <strong class="child-tag">strong</strong>
        <small class="child-tag">small</small>
      </div>

      <button type="button" id="btn-count-children" class="btn btn-custom mt-3">
        <i class="bi bi-hash me-1"></i> ¿Cuántos hijos tiene este div?
      </button>
      <div id="children-result" class="result-panel mt-3" aria-live="polite"></div>
    </section>

    <section class="terminal-console">
      <div class="terminal-header">
        <div class="d-flex align-items-center">
          <span class="terminal-dot dot-red"></span><span class="terminal-dot dot-yellow"></span><span class="terminal-dot dot-green"></span>
          <span class="text-white fs-7 ms-2 fw-semibold"><i class="bi bi-terminal me-1"></i> Consola Visual</span>
        </div>
        <button id="btn-clear-console" class="btn btn-sm btn-dark border-0 fs-7" type="button"><i class="bi bi-trash3 me-1"></i> Limpiar</button>
      </div>
      <div id="console-body" class="terminal-body"><div class="console-placeholder text-muted fst-italic fs-7">Esperando eventos...</div></div>
    </section>
  </main>

  <button id="back-to-top" class="back-to-top" type="button"><i class="bi bi-arrow-up-short"></i></button>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../scripts/app.js"></script>
</body>
</html>
