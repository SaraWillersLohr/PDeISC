<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Maestro: reverse() | Académicamente Correcto</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS Propio -->
    <link rel="stylesheet" href="../styles/style.css">
</head>

<body>
    <div class="container py-5">
        <header class="text-center mb-5">
            <h1 class="display-4 fw-800 text-dark mb-2">Mastering <code>reverse()</code></h1>
            <p class="text-muted lead mx-auto" style="max-width: 600px;">
                Inversión de orden in-place mediante 2 demostraciones independientes.
            </p>
        </header>

        <div class="row g-4 justify-content-center">
            <!-- EJERCICIO 1: EFECTO ESPEJO -->
            <div class="col-lg-6">
                <div class="card-premium h-100 text-center">
                    <h2 class="section-title justify-content-center mb-4"><i
                            class="fas fa-arrows-rotate text-primary"></i> 1. Espejo</h2>
                    <p class="text-muted small">Invierte una cadena de caracteres usando <code>reverse()</code>.</p>
                    <div id="contLetras" class="letras-contenedor mb-4"></div>
                    <button id="btnRevLet" class="btn-modern btn-primary-modern w-100">
                        <i class="fas fa-sync"></i> Aplicar reverse()
                    </button>
                </div>
            </div>

            <!-- EJERCICIO 2: LISTA TAREAS -->
            <div class="col-lg-6">
                <div class="card-premium h-100">
                    <h2 class="section-title mb-4"><i class="fas fa-list-check text-success"></i> 2. Orden Cronológico
                    </h2>
                    <p class="text-muted small">Invierte el orden de la lista de tareas usando <code>reverse()</code>.
                    </p>
                    <div id="listaTask" class="items-container mb-4" style="min-height: 200px;"></div>
                    <button id="btnRevTask" class="btn-modern btn-primary-modern w-100">
                        <i class="fas fa-sort"></i> Invertir Orden
                    </button>
                </div>
            </div>
        </div>

        <footer class="mt-5 text-center">
            <button id="btnReset" class="btn-modern btn-outline-modern px-5">
                <i class="fas fa-sync"></i> Reiniciar Ejercicios
            </button>
        </footer>
    </div>
    <script src="../scripts/script.js" type="module"></script>
</body>

</html>
