<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P6 — Formulario de registro | Sara Willers Lohr</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link id="theme-link" rel="stylesheet" href="../styles/light.css">
  <link rel="stylesheet" href="../styles/responsive.css">
  <script src="../scripts/theme.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg sticky-top custom-navbar py-2">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <i class="bi bi-ui-checks text-primary me-2 fs-3"></i>
        <span><span class="fw-bold text-main d-block lh-1">P6 · Formulario</span><small class="text-muted">Registro dinámico</small></span>
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navP6"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="navP6">
        <span class="navbar-text ms-lg-3 text-muted"><i class="bi bi-mortarboard me-1"></i> Sara Willers Lohr</span>
        <div class="ms-auto"><button id="btn-theme-toggle" class="btn btn-outline-secondary rounded-circle btn-theme-toggle" type="button"><i id="theme-icon" class="bi bi-sun-fill fs-5"></i></button></div>
      </div>
    </div>
  </nav>

  <main class="container py-3 pb-5">
    <section class="glass-panel p-4 mb-4">
      <span class="workspace-badge"><i class="bi bi-6-circle-fill me-1"></i> Consigna 6</span>
      <h1 class="h3 fw-bold text-main mb-2">Formulario de registro</h1>
      <p class="text-muted mb-4">Campos: texto, radio, select, checkbox, number y email. Al enviar, muestro los datos en el mismo HTML.</p>

      <div class="row g-4">
        <div class="col-lg-6">
          <form id="registro-form" class="registro-form" novalidate>
            <div class="mb-3">
              <label for="reg-nombre" class="form-label fw-semibold">Nombre (texto)</label>
              <input type="text" id="reg-nombre" name="nombre" class="form-control" required pattern="[A-Za-zÁÉÍÓÚáéíóúÑñÜü\\s]{2,}" minlength="2" maxlength="60">
              <div id="err-nombre" class="invalid-feedback"></div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold d-block">Género (radio)</label>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="reg-genero" id="gen-f" value="Femenino" required>
                <label class="form-check-label" for="gen-f">Femenino</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="reg-genero" id="gen-m" value="Masculino">
                <label class="form-check-label" for="gen-m">Masculino</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="reg-genero" id="gen-o" value="Otro">
                <label class="form-check-label" for="gen-o">Otro</label>
              </div>
              <div id="err-genero" class="invalid-feedback d-block"></div>
            </div>
            <div class="mb-3">
              <label for="reg-pais" class="form-label fw-semibold">País (select)</label>
              <select id="reg-pais" name="pais" class="form-select" required>
                <option value="">— Elegí —</option>
                <option value="Argentina">Argentina</option>
                <option value="Uruguay">Uruguay</option>
                <option value="Chile">Chile</option>
              </select>
              <div id="err-pais" class="invalid-feedback"></div>
            </div>
            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="reg-terminos" required>
              <label class="form-check-label" for="reg-terminos">Acepto términos (checkbox)</label>
              <div id="err-terminos" class="invalid-feedback d-block"></div>
            </div>
            <div class="mb-3">
              <label for="reg-edad" class="form-label fw-semibold">Edad (number)</label>
              <input type="number" id="reg-edad" name="edad" class="form-control" required min="18" max="100">
              <div id="err-edad" class="invalid-feedback"></div>
            </div>
            <div class="mb-3">
              <label for="reg-email" class="form-label fw-semibold">Email</label>
              <input type="email" id="reg-email" name="email" class="form-control" required maxlength="80">
              <div id="err-email" class="invalid-feedback"></div>
            </div>
            <button type="submit" class="btn btn-custom w-100"><i class="bi bi-send-fill me-1"></i> Registrar</button>
          </form>
        </div>
        <div class="col-lg-6">
          <div id="registro-resultado" class="result-panel registro-resultado h-100" aria-live="polite">
            <p class="text-muted fs-7 mb-0">Los datos validados aparecerán acá.</p>
          </div>
        </div>
      </div>
    </section>

    <section class="terminal-console">
      <div class="terminal-header">
        <div class="d-flex align-items-center">
          <span class="terminal-dot dot-red"></span><span class="terminal-dot dot-yellow"></span><span class="terminal-dot dot-green"></span>
          <span class="text-white fs-7 ms-2 fw-semibold"><i class="bi bi-terminal me-1"></i> Consola Visual</span>
        </div>
        <button id="btn-clear-console" class="btn btn-sm btn-dark border-0 fs-7" type="button"><i class="bi bi-trash3 me-1"></i> Limpiar</button>
      </div>
      <div id="console-body" class="terminal-body"><div class="console-placeholder text-muted fst-italic fs-7">Esperando eventos...</div></div>
    </section>
  </main>

  <button id="back-to-top" class="back-to-top" type="button"><i class="bi bi-arrow-up-short"></i></button>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../scripts/app.js"></script>
</body>
</html>
