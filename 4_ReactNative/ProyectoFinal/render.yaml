# Blueprint del backend de EstanciaApp. La base MySQL se configura en un proveedor externo.
services:
  - type: web
    name: estanciaapp-api
    runtime: node
    plan: free
    region: ohio
    # Ruta relativa a la raíz del repositorio monorepo PDeISC.
    rootDir: 4_ReactNative/ProyectoFinal/backend
    buildCommand: npm install --include=dev && npm run build && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://estanciaapp-frontend-nine.vercel.app
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_CA_CERT
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: VERIFICATION_CODE_SECRET
        generateValue: true
      # Render bloquea SMTP en 25, 465 y 587; configurar un proveedor que admita 2525.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
