<!-- Comentarios claros: esta página muestra la estructura y el contenido. -->
<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto 1 | VIP Guest List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/styles/style.css">
</head>
<body>
    <nav class="app-navbar navbar navbar-expand-lg sticky-top">
        <div class="container-fluid app-container">
            <a class="navbar-brand" href="#">VIP Guest List</a>
            <div class="d-flex align-items-center gap-2 ms-auto">
                <span class="badge-count">Invitados: <strong id="guestCount">0</strong></span>
                <button type="button" id="themeToggle" class="btn-theme" aria-label="Cambiar tema">◐ Tema</button>
            </div>
        </div>
    </nav>

    <main class="app-container py-4 py-lg-5">
        <header class="page-header text-center mb-4 mb-lg-5">
            <p class="kicker">Proyecto 1 · Página dinámica</p>
            <h1 class="page-title">Registro VIP sin recarga</h1>
            <p class="page-subtitle">Demostración de las 3 formas de lectura de formularios en JavaScript</p>
        </header>

        <div class="layout-main">
            <section class="glass-panel form-panel">
                <h2 class="section-title">Nuevo invitado</h2>
                <form id="guestForm" name="invitadosForm" novalidate>
                    <div class="row g-3 g-lg-4">
                        <div class="col-12 col-md-6">
                            <label class="form-label" for="nombre">Nombre</label>
                            <input type="text" id="nombre" name="nombre" class="form-control" autocomplete="given-name">
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label" for="apellido">Apellido</label>
                            <input type="text" id="apellido" name="apellido" class="form-control" autocomplete="family-name">
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-6 col-md-4">
                            <label class="form-label" for="edad">Edad</label>
                            <input type="number" id="edad" name="edad" class="form-control" min="18" max="99">
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-6 col-md-4">
                            <label class="form-label" for="tipoEntrada">Tipo entrada</label>
                            <select id="tipoEntrada" name="tipoEntrada" class="form-select">
                                <option value="General">General</option>
                                <option value="VIP">VIP Gold</option>
                                <option value="Platinum">Platinum</option>
                            </select>
                        </div>
                        <div class="col-12 col-md-4">
                            <label class="form-label" for="acompanantes">Acompañantes</label>
                            <input type="number" id="acompanantes" name="acompanantes" class="form-control" value="0" min="0" max="5">
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="email">Email</label>
                            <input type="email" id="email" name="email" class="form-control" autocomplete="email">
                            <div class="invalid-feedback"></div>
                        </div>
                    </div>

                    <div class="terms-box mt-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="termsCheck">
                            <label class="form-check-label" for="termsCheck">Acepto los términos del evento</label>
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="btn btn-primary w-100 mt-4" disabled>Confirmar registro</button>
                </form>
            </section>

            <aside class="side-panel">
                <section class="glass-panel">
                    <h2 class="section-title">Lectura en vivo</h2>
                    <p class="small text-muted mb-3">Al enviar el formulario se muestran los 3 métodos:</p>
                    <div id="methodsPanel" class="methods-grid">
                        <p class="method-placeholder">Todavía no se leyó el formulario.</p>
                    </div>
                </section>
            </aside>
        </div>

        <section class="records-section mt-5">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <h2 class="section-title mb-0">Invitados confirmados</h2>
            </div>
            <div class="records-list-wrap glass-panel">
                <div id="guestList" class="row g-3"></div>
            </div>
        </section>
    </main>

    <div id="toastZone" class="toast-zone" aria-live="polite"></div>

    <button type="button" id="btnScrollTop" class="btn-scroll-top" aria-label="Subir arriba" hidden>↑</button>
    <script>
      (function () {
        const btn = document.getElementById("btnScrollTop");
        if (!btn) return;
        const toggle = () => { btn.hidden = window.scrollY < 320; };
        window.addEventListener("scroll", toggle, { passive: true });
        toggle();
        btn.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
      })();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/scripts/main.js"></script>
</body>
</html>
