<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto 3 | Registro de Personas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/styles/style.css">
</head>
<body>
    <nav class="app-navbar navbar sticky-top">
        <div class="container-fluid app-container">
            <a class="navbar-brand" href="#">SkyCheck-In</a>
            <div class="d-flex align-items-center gap-2 ms-auto flex-wrap justify-content-end">
                <span class="badge-count">Registros: <strong id="peopleCount">0</strong></span>
                <button type="button" id="themeToggle" class="btn-theme" aria-label="Cambiar tema">◐ Tema</button>
            </div>
        </div>
    </nav>

    <main class="app-container py-4 py-lg-5">
        <header class="page-header text-center mb-4">
            <p class="kicker">Proyecto 3 · localStorage</p>
            <h1 class="page-title">Almacén de personas</h1>
            <p class="page-subtitle">Validaciones por país, prefijo automático y edad real con Date</p>
        </header>

        <div id="saveStatus" class="save-status glass-panel mb-3" hidden>Estado del guardado</div>

        <div class="layout-main layout-main--p3">
            <section class="glass-panel form-panel-p3">
                <h2 class="section-title">Formulario de registro</h2>
                <form id="passengerForm" novalidate>
                    <div class="row g-3">
                        <div class="col-12 col-md-6 field-wrap">
                            <label class="form-label" for="nombre">Nombre</label>
                            <div class="input-with-icon">
                                <input type="text" id="nombre" class="form-control">
                                <span class="field-icon icon-empty" aria-hidden="true"></span>
                            </div>
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-12 col-md-6 field-wrap">
                            <label class="form-label" for="apellido">Apellido</label>
                            <div class="input-with-icon">
                                <input type="text" id="apellido" class="form-control">
                                <span class="field-icon icon-empty" aria-hidden="true"></span>
                            </div>
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="col-12 col-md-6 field-wrap">
                            <label class="form-label" for="nacionalidad">Nacionalidad</label>
                            <div class="input-with-icon">
                                <select id="nacionalidad" class="form-select" name="nacionalidad">
                                    <option value="">Seleccioná país</option>
                                    <option value="argentina">Argentina</option>
                                    <option value="chile">Chile</option>
                                    <option value="uruguay">Uruguay</option>
                                    <option value="brasil">Brasil</option>
                                    <option value="paraguay">Paraguay</option>
                                </select>
                                <span class="field-icon icon-empty" aria-hidden="true"></span>
                            </div>
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="col-12 col-md-6 field-wrap">
                            <label class="form-label" for="documento">Documento</label>
                            <div class="input-with-icon">
                                <input type="text" id="documento" class="form-control" inputmode="numeric" autocomplete="off">
                                <span class="field-icon icon-empty" aria-hidden="true"></span>
                            </div>
                            <div class="invalid-feedback"></div>
                            <small id="documentoHint" class="field-hint">Elegí nacionalidad para ver el formato</small>
                        </div>

                        <div class="col-12 field-wrap">
                            <label class="form-label" for="telefono">Teléfono</label>
                            <div class="phone-row input-with-icon">
                                <select id="prefijoTelefono" class="form-select prefijo-select" disabled aria-label="Prefijo internacional">
                                    <option value="">+?</option>
                                    <option value="+54">+54</option>
                                    <option value="+56">+56</option>
                                    <option value="+598">+598</option>
                                    <option value="+55">+55</option>
                                    <option value="+595">+595</option>
                                </select>
                                <input type="tel" id="telefono" class="form-control" inputmode="numeric" autocomplete="off">
                                <span class="field-icon icon-empty" aria-hidden="true"></span>
                            </div>
                            <div class="invalid-feedback"></div>
                            <div class="d-flex flex-wrap justify-content-between gap-1 mt-1">
                                <small id="telefonoHint" class="field-hint"></small>
                                <small id="telefonoContador" class="field-hint field-hint--count"></small>
                            </div>
                        </div>

                        <div class="col-6 col-md-3 field-wrap">
                            <label class="form-label" for="edad">Edad</label>
                            <div class="input-with-icon">
                                <input type="number" id="edad" class="form-control" min="0" max="110">
                                <span class="field-icon icon-empty" aria-hidden="true"></span>
                            </div>
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-6 col-md-3 field-wrap">
                            <label class="form-label" for="fechaNac">Fecha nacimiento</label>
                            <div class="input-with-icon">
                                <input type="date" id="fechaNac" class="form-control">
                                <span class="field-icon icon-empty" aria-hidden="true"></span>
                            </div>
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-12 col-md-6 field-wrap">
                            <label class="form-label" for="sexo">Sexo</label>
                            <div class="input-with-icon">
                                <select id="sexo" class="form-select">
                                    <option value="male">Masculino</option>
                                    <option value="female">Femenino</option>
                                </select>
                                <span class="field-icon icon-empty" aria-hidden="true"></span>
                            </div>
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="col-12 col-md-6 field-wrap">
                            <label class="form-label" for="estadoCivil">Estado civil</label>
                            <div class="input-with-icon">
                                <select id="estadoCivil" class="form-select">
                                    <option value="soltero">Soltero/a</option>
                                    <option value="casado">Casado/a</option>
                                    <option value="divorciado">Divorciado/a</option>
                                    <option value="viudo">Viudo/a</option>
                                </select>
                                <span class="field-icon icon-empty" aria-hidden="true"></span>
                            </div>
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="col-12 field-wrap">
                            <label class="form-label" for="email">Mail</label>
                            <div class="input-with-icon">
                                <input type="email" id="email" class="form-control" autocomplete="email">
                                <span class="field-icon icon-empty" aria-hidden="true"></span>
                            </div>
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="col-6 col-md-4 field-wrap">
                            <label class="form-label" for="tieneHijos">Hijos</label>
                            <select id="tieneHijos" class="form-select">
                                <option value="no">No</option>
                                <option value="si">Sí</option>
                            </select>
                        </div>
                        <div class="col-6 col-md-4 field-wrap">
                            <label class="form-label" for="cantidadHijos">Cantidad</label>
                            <div class="input-with-icon">
                                <input type="number" id="cantidadHijos" class="form-control" value="0" disabled min="0" max="12">
                                <span class="field-icon icon-empty" aria-hidden="true"></span>
                            </div>
                            <div class="invalid-feedback"></div>
                        </div>
                    </div>

                    <div class="terms-box mt-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="termsCheck">
                            <label class="form-check-label" for="termsCheck">Confirmo que los datos son correctos</label>
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="btn btn-primary w-100 mt-3" disabled>Guardar en localStorage</button>
                </form>
            </section>

            <aside class="side-stack">
                <section class="glass-panel console-panel" id="eventConsole">
                    <div class="console-head">
                        <h2 class="section-title mb-0">Consola visual</h2>
                        <button type="button" id="clearConsole" class="btn btn-sm btn-outline-secondary">Limpiar</button>
                    </div>
                    <div class="console-body"></div>
                </section>

                <section class="glass-panel names-panel">
                    <h2 class="section-title">Nombres completos</h2>
                    <ul id="namesList" class="names-list"></ul>
                </section>
            </aside>
        </div>

        <section class="mt-5">
            <h2 class="section-title">Personas almacenadas</h2>
            <div id="passengerList" class="row g-3"></div>
        </section>
    </main>

    <div id="toastZone" class="toast-zone"></div>

    <button type="button" id="btnScrollTop" class="btn-scroll-top" aria-label="Subir arriba" hidden>↑</button>
    <script>
      (function () {
        const btn = document.getElementById("btnScrollTop");
        if (!btn) return;
        const toggle = () => { btn.hidden = window.scrollY < 320; };
        window.addEventListener("scroll", toggle, { passive: true });
        toggle();
        btn.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
      })();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/scripts/main.js"></script>
</body>
</html>
